<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EduGenie — AI Learning Assistant</title>
  <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
</head>
<body>
  <header class="hero">
    <div class="container">
      <span class="badge">AI LEARNING ASSISTANT</span>
      <h1>EduGenie</h1>
      <p>Ask, explain, quiz, summarize, and build a learning path with Gemini.</p>
    </div>
  </header>

  <main class="container app-shell">
    <section class="card controls">
      <label for="task">Choose a task</label>
      <select id="task">
        <option value="qa">Ask a Question</option>
        <option value="explain">Explain a Topic</option>
        <option value="quiz">Generate Quiz</option>
        <option value="summarize">Summarize Text</option>
        <option value="learn">Learning Path</option>
      </select>

      <label for="level">Learner level</label>
      <select id="level">
        <option value="beginner">Beginner</option>
        <option value="school">School student</option>
        <option value="college">College student</option>
        <option value="advanced">Advanced</option>
      </select>

      <label id="input-label" for="input-text">Your question</label>
      <textarea id="input-text" rows="10"
        placeholder="Example: What is the difference between AI and machine learning?"></textarea>

      <div id="hours-wrap" class="hidden">
        <label for="hours">Hours per week</label>
        <input id="hours" type="number" min="1" max="40" value="5">
      </div>

      <button id="submit-btn">Generate</button>
      <p id="status" class="status"></p>
    </section>

    <section class="card result-card">
      <div class="result-heading">
        <h2>Result</h2>
        <button id="copy-btn" class="secondary" disabled>Copy</button>
      </div>
      <div id="result" class="result">
        <p class="muted">Your AI-generated result will appear here.</p>
      </div>
    </section>
  </main>

  <footer class="container footer">
    EduGenie • FastAPI + Google Gemini
  </footer>

<script>
const task = document.getElementById("task");
const level = document.getElementById("level");
const input = document.getElementById("input-text");
const label = document.getElementById("input-label");
const hoursWrap = document.getElementById("hours-wrap");
const hours = document.getElementById("hours");
const submit = document.getElementById("submit-btn");
const result = document.getElementById("result");
const status = document.getElementById("status");
const copyBtn = document.getElementById("copy-btn");

function updateForm() {
  const value = task.value;
  hoursWrap.classList.toggle("hidden", value !== "learn");

  const labels = {
    qa: ["Your question", "Example: What is polymorphism in Java?"],
    explain: ["Topic to explain", "Example: Photosynthesis"],
    quiz: ["Passage or topic", "Paste a passage or enter a topic to quiz yourself."],
    summarize: ["Text to summarize", "Paste the educational passage here."],
    learn: ["Topic to learn", "Example: SQL"]
  };
  label.textContent = labels[value][0];
  input.placeholder = labels[value][1];
}

task.addEventListener("change", updateForm);
updateForm();

function escapeHtml(value) {
  return value.replace(/[&<>"']/g, ch => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#039;"
  }[ch]));
}

function renderText(text) {
  return `<div class="text-output">${escapeHtml(text)
    .replace(/\n\n/g, "</p><p>")
    .replace(/\n/g, "<br>")}</div>`;
}

function renderQuiz(quiz) {
  return `<div class="quiz">${quiz.questions.map((q, i) => `
    <article class="question">
      <h3>${i + 1}. ${escapeHtml(q.question)}</h3>
      <div class="options">
        ${q.options.map((option, j) => `
          <button class="option" data-answer="${encodeURIComponent(option)}"
                  data-correct="${encodeURIComponent(q.correct_answer)}"
                  data-explanation="${encodeURIComponent(q.explanation)}">
            ${String.fromCharCode(65+j)}. ${escapeHtml(option)}
          </button>`).join("")}
      </div>
      <p class="feedback" id="feedback-${i}"></p>
    </article>
  `).join("")}</div>`;
}

function renderLearningPath(data) {
  return `<div>
    <h3>${escapeHtml(data.topic)}</h3>
    <p>${escapeHtml(data.overview)}</p>
    ${data.steps.map((step, i) => `
      <article class="learning-step">
        <h3>${i+1}. ${escapeHtml(step.stage)}</h3>
        <p><strong>Time:</strong> ${escapeHtml(step.suggested_time)}</p>
        <p><strong>Topics:</strong> ${step.topics.map(escapeHtml).join(", ")}</p>
        <p><strong>Resources:</strong> ${step.resources.map(escapeHtml).join(" • ")}</p>
        <p><strong>Practice:</strong> ${step.practice.map(escapeHtml).join(" • ")}</p>
      </article>
    `).join("")}
  </div>`;
}

async function run() {
  const value = input.value.trim();
  if (!value) {
    status.textContent = "Please enter some text first.";
    return;
  }

  submit.disabled = true;
  copyBtn.disabled = true;
  status.textContent = "Generating…";
  result.innerHTML = '<p class="muted">EduGenie is thinking...</p>';

  const endpoints = {
    qa: "/qa",
    explain: "/explain",
    quiz: "/quiz",
    summarize: "/summarize",
    learn: "/learn/recommendations"
  };

  let body;
  if (task.value === "qa") body = {question: value, level: level.value};
  if (task.value === "explain") body = {topic: value, level: level.value};
  if (task.value === "quiz") body = {text: value, level: level.value};
  if (task.value === "summarize") body = {text: value, level: level.value};
  if (task.value === "learn") body = {
    topic: value, level: level.value, hours_per_week: Number(hours.value)
  };

  try {
    const response = await fetch(endpoints[task.value], {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify(body)
    });

    const data = await response.json();
    if (!response.ok) throw new Error(data.detail || "Request failed.");

    if (task.value === "qa" || task.value === "explain") {
      result.innerHTML = renderText(data.answer);
    } else if (task.value === "summarize") {
      result.innerHTML = renderText(data.summary);
    } else if (task.value === "quiz") {
      result.innerHTML = renderQuiz(data.quiz);
      document.querySelectorAll(".option").forEach(btn => {
        btn.addEventListener("click", () => {
          const answer = decodeURIComponent(btn.dataset.answer);
          const correct = decodeURIComponent(btn.dataset.correct);
          const explanation = decodeURIComponent(btn.dataset.explanation);
          const feedback = btn.closest(".question").querySelector(".feedback");
          if (answer === correct) {
            feedback.textContent = "✓ Correct! " + explanation;
            feedback.className = "feedback correct";
          } else {
            feedback.textContent = "✗ Not quite. Correct answer: " + correct +
              ". " + explanation;
            feedback.className = "feedback wrong";
          }
        });
      });
    } else {
      result.innerHTML = renderLearningPath(data.recommendations);
    }

    status.textContent = "Done.";
    copyBtn.disabled = false;
  } catch (error) {
    result.innerHTML = `<p class="error">${escapeHtml(error.message)}</p>`;
    status.textContent = "Request failed.";
  } finally {
    submit.disabled = false;
  }
}

submit.addEventListener("click", run);

copyBtn.addEventListener("click", async () => {
  await navigator.clipboard.writeText(result.innerText);
  status.textContent = "Result copied.";
});
</script>
</body>
</html>
